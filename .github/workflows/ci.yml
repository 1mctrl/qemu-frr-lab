name: CI - QEMU FRR Lab

on:
  push:
    branches: [ virt-net ]
  pull_request:
    branches: [ virt-net ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Syntax check
        run: |
          for f in setup-net.sh starts/*.sh; do
            bash -n "$f"
          done

      - name: ShellCheck
        run: shellcheck --severity=warning setup-net.sh starts/*.sh

  network:
    name: Network setup dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get install -y iproute2 bridge-utils iptables

      - name: Run setup-net.sh
        run: |
          sudo bash setup-net.sh lo
          ip -br link show type bridge
          ip -br link show type tun

      - name: Verify bridges exist
        run: |
          for br in br-host-gw br-gw-r1 br-gw-r2 br-r1-c1 br-r1-c2 br-r2-c3; do
            ip link show "$br" > /dev/null && echo "OK: $br" || { echo "MISSING: $br"; exit 1; }
          done

      - name: Verify taps exist
        run: |
          for tap in tap-gw-host tap-gw-r1 tap-gw-r2 tap-r1-gw tap-r1-c1 tap-r1-c2 tap-r2-gw tap-r2-c3 tap-c1 tap-c2 tap-c3; do
            ip link show "$tap" > /dev/null && echo "OK: $tap" || { echo "MISSING: $tap"; exit 1; }
          done

      - name: Verify ip_forward
        run: |
          val=$(cat /proc/sys/net/ipv4/ip_forward)
          [ "$val" = "1" ] && echo "OK: ip_forward=1" || { echo "FAIL: ip_forward=$val"; exit 1; }

      - name: Run setup-net.sh
        run: sudo bash -x setup-net.sh lo 2>&1 || true

  qemu:
    name: QEMU smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install deps
        run: sudo apt-get install -y qemu-system-x86 qemu-utils

      - name: Check qemu version
        run: qemu-system-x86_64 --version

      - name: Inspect qcow files
        run: |
          for f in qcows/*.qcow2; do
            qemu-img info "$f"
          done

      - name: Verify start scripts reference correct qcow paths
        run: |
          for f in starts/*.sh; do
            grep -q "qcows/" "$f" && echo "OK: $f" || { echo "WARN: $f has no qcows/ reference"; }
          done

      - name: Boot GW disk (no KVM)
        run: |
          timeout 10s qemu-system-x86_64 \
            -name gw \
            -m 512 \
            -no-reboot \
            -drive file=qcows/gw.qcow2,format=qcow2,if=virtio \
            -nographic \
            -serial null || true
          echo "QEMU exited cleanly"
