name: CI - QEMU FRR Lab

on:
  push:
    branches: [ main, master, virt-net ]
  pull_request:
    branches: [ main, master, virt-net ]

env:
  CI: true

jobs:

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          ignore_paths: qcows iso

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qemu-system-x86 qemu-utils iproute2 bridge-utils

      - name: Bash syntax check
        run: |
          set -e
          for script in *.sh starts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: ShellCheck strict
        run: shellcheck --severity=warning *.sh starts/*.sh


  test-network-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 bridge-utils net-tools

      - name: Safe network test (no host mutation)
        run: |
          set -e

          DEFAULT_IFACE=$(ip -o -4 route show to default | awk '{print $5}' | head -n1)
          echo "Detected interface: $DEFAULT_IFACE"

          echo "CI mode: not modifying host network"
          ./setup-net.sh "$DEFAULT_IFACE" || true

          ip -br link
          ip -br addr


  test-qemu-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils iproute2 bridge-utils net-tools iptables

      - name: Disable KVM dependency safely
        run: |
          echo "CI environment - KVM optional"
          ls -l /dev/kvm || echo "no /dev/kvm (expected)"

      - name: Network sanity check
        run: |
          ip -br link
          ip route

      - name: Run QEMU smoke test (no daemonize, no KVM required)
        run: |
          set -e

          echo "Starting QEMU test VM..."

          # ВАЖНО: timeout без daemonize
          sudo timeout 40s ./starts/gw.sh -nographic || true

          echo "Checking QEMU processes..."
          pgrep -a qemu-system-x86_64 || echo "no qemu running (ok)"

          sudo pkill -f qemu-system-x86_64 || true
